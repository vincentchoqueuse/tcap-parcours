<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TCAP · Parcours</title>
  <meta name="description" content="Les parcours du club TCAP : carte, profil, dénivelé, durée indicative et trace GPX.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="assets/logo-96.png">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <a class="brand" href="./" id="brand">
    <img src="assets/logo-96.png" alt="" width="40" height="33">
    <span class="brand-name">TCAP</span><span class="brand-sub">Parcours</span>
  </a>
  <button type="button" class="btn btn-primary admin-only" id="share-selection" title="Partager le sondage" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>
    <span class="label">Partager</span><span id="share-selection-count"></span>
  </button>
</header>

<div class="main">

  <!-- Carte -->
  <div class="map-area">
    <div id="map"></div>
    <div class="map-controls">
      <div class="segmented" role="group" aria-label="Fond de carte">
        <button type="button" class="segmented-btn is-active" data-mode="classic">Classique</button>
        <button type="button" class="segmented-btn" data-mode="relief">Relief / D+</button>
      </div>
      <div class="slope-legend" id="slope-legend" hidden>
        <i class="sw sw-1"></i>&lt;0 % <i class="sw sw-2"></i>0–4 <i class="sw sw-3"></i>4–8 <i class="sw sw-4"></i>8–12 <i class="sw sw-5"></i>&gt;12 %
      </div>
    </div>
    <div class="map-hint desktop-only" id="map-hint">Cliquez sur un tracé ou choisissez un parcours dans la liste.</div>
  </div>

  <!-- Panneau : colonne à gauche (bureau) / feuille inférieure (mobile). Deux vues : liste ou fiche. -->
  <aside class="panel" id="panel">
    <button type="button" class="sheet-handle mobile-only" id="sheet-handle" aria-label="Déplier ou replier"></button>

    <section class="view" id="list-view">
      <div class="panel-head">
        <div class="head-row">
          <strong>Parcours</strong>
          <span class="count" id="count-mobile"></span>
          <button type="button" class="btn btn-sm admin-only mobile-only" id="toggle-filters" aria-expanded="false">Filtres<span class="badge" id="filters-badge" hidden></span></button>
        </div>
      </div>
      <div class="panel-body">
        <form class="filters admin-only" id="filters" onsubmit="return false">
          <label>Départ <select id="filter-start"></select></label>
          <label>Type de séance <select id="filter-type"></select></label>
          <label>Terrain <select id="filter-tag"></select></label>
          <label>Trier par <select id="filter-sort"></select></label>
          <div class="filter-range">
            <span class="filter-range-title">Distance <em id="range-value"></em></span>
            <div class="dual-range">
              <div class="dual-range-track"><div class="dual-range-fill" id="range-fill"></div></div>
              <input type="range" id="range-min" min="0" max="100" step="1" value="0" aria-label="Distance minimale (km)">
              <input type="range" id="range-max" min="0" max="100" step="1" value="100" aria-label="Distance maximale (km)">
            </div>
          </div>
          <div class="filters-foot"><span id="count-desktop"></span><button type="button" class="link-btn admin-only" id="clear-selection" hidden>Vider la sélection</button><button type="button" class="link-btn" id="reset-filters">Réinitialiser</button></div>
        </form>
        <ul class="route-list" id="route-list"></ul>
      </div>
    </section>

    <section class="view" id="detail-view" hidden>
      <div class="panel-head detail-head" id="detail-head"></div>
      <div class="panel-body info" id="info"></div>
    </section>
  </aside>

</div>

<!-- QR code d'un parcours -->
<div class="modal-backdrop" id="qr-backdrop" hidden></div>
<section class="modal qr-modal" id="qr-modal" hidden role="dialog" aria-modal="true" aria-labelledby="qr-title">
  <div class="modal-head"><strong id="qr-title">QR code</strong><button type="button" class="close" id="qr-close" aria-label="Fermer">×</button></div>
  <div class="segmented qr-switch" role="group" aria-label="Contenu du QR code">
    <button type="button" class="segmented-btn is-active" data-qr="page">Fiche du parcours</button>
    <button type="button" class="segmented-btn" data-qr="gpx">Fichier GPX</button>
  </div>
  <div class="qr-code" id="qr-code"></div>
  <p class="qr-hint" id="qr-hint"></p>
  <input type="text" class="qr-url" id="qr-url" readonly>
</section>

<div class="toast" id="toast" hidden></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js" crossorigin="anonymous"></script>
<script src="data/routes.js"></script>
<script src="script.js"></script>
</body>
</html>
